name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test imports
        run: python -c "import pyatv, soundcard, numpy, miniaudio, tkinter, soxr, moderngl, pyglet, viz3d; from pyatv.auth.hap_srp import SRPAuthHandler; h=SRPAuthHandler(); h.initialize(); h.step1(3939); print('imports + pairing step ok')"
      - name: Stamp build number
        shell: bash
        run: sed -i "s/^BUILD_NUMBER = 0 /BUILD_NUMBER = ${{ github.run_number }} /" homepod_link.py && grep -n "^BUILD_NUMBER" homepod_link.py
      - name: Stamp report key
        shell: bash
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          python - <<'PY'
          import os, re
          tok = os.environ.get("REPORT_TOKEN", "")
          p = "homepod_link.py"
          s = open(p, encoding="utf-8").read()
          s = s.replace('REPORT_TOKEN = ""  #', f'REPORT_TOKEN = "{tok}"  #', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("report key stamped" if tok else "no REPORT_TOKEN secret - reports disabled in this build")
          PY
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name HomePodLink
          --collect-all pyatv --collect-all soundcard --collect-all miniaudio --collect-all soxr --collect-all moderngl --collect-all glcontext --collect-all pyglet --hidden-import viz3d
          homepod_link.py
      - name: Checksum
        id: sum
        shell: bash
        run: echo "sha=$(sha256sum dist/HomePodLink.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HomePodLink
          path: dist/HomePodLink.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HomePod Link build ${{ github.run_number }}
          files: dist/HomePodLink.exe
          body: |
            Download **HomePodLink.exe** below, or use **Update** inside the app.

            sha256: ${{ steps.sum.outputs.sha }}
