name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test imports
        run: python -c "import pyatv, soundcard, numpy, miniaudio, tkinter; from pyatv.auth.hap_srp import SRPAuthHandler; h=SRPAuthHandler(); h.initialize(); h.step1(3939); print('imports + pairing step ok')"
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name HomePodLink
          --collect-all pyatv --collect-all soundcard --collect-all miniaudio
          homepod_link.py
      - uses: actions/upload-artifact@v4
        with:
          name: HomePodLink
          path: dist/HomePodLink.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HomePod Link build ${{ github.run_number }}
          files: dist/HomePodLink.exe
